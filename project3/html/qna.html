<!-- ================= Q&A ================= -->

<section id="qna" class="py-28 bg-[#FAF8F5]">

<div class="max-w-6xl mx-auto px-6">

    <div class="text-center">

        <span class="text-[#B58B5A] font-bold tracking-[0.3em]">
            COMMUNITY
        </span>

        <h2 class="text-5xl font-black mt-5">
            Q&A
            <span class="text-[#C28B8B]">& REVIEW</span>
        </h2>

        <p class="mt-5 text-slate-500">
            자주 묻는 질문과 실제 참여자 후기를 확인해보세요.
        </p>

    </div>

    <div id="faq-admin-panel" class="hidden mt-8 rounded-3xl border border-dashed border-[#E5D5C4] bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h4 class="font-bold text-lg">관리자 Q&A 추가</h4>
                <p class="text-sm text-slate-500">자주 묻는 질문을 추가하거나 삭제할 수 있습니다.</p>
            </div>
        </div>
        <div class="mt-4 grid gap-3 md:grid-cols-[1.2fr_1.2fr_auto]">
            <input id="faq-question" class="rounded-2xl border border-slate-200 px-4 py-3" placeholder="질문을 입력하세요" />
            <input id="faq-answer" class="rounded-2xl border border-slate-200 px-4 py-3" placeholder="답변을 입력하세요" />
            <input type="hidden" id="faq-edit-id" />
            <button id="faq-submit-btn" type="button" class="rounded-2xl bg-[#C28B8B] px-4 py-3 font-semibold text-white">추가</button>
        </div>
    </div>

    <div id="faq-list" class="mt-20 space-y-5"></div>

    <div class="mt-24">

        <h3 class="text-3xl font-black text-center">
            실제 참여 후기
        </h3>

        <div id="review-admin-panel" class="hidden mt-8 rounded-3xl border border-dashed border-[#E5D5C4] bg-white p-6 shadow-sm">
            <h4 class="font-bold text-lg">관리자 리뷰 추가</h4>
            <p class="text-sm text-slate-500">실제 참여 후기를 등록하거나 삭제할 수 있습니다.</p>
            <div class="mt-4 grid gap-3 md:grid-cols-[1fr_1fr_auto]">
                <input id="review-name" class="rounded-2xl border border-slate-200 px-4 py-3" placeholder="작성자" />
                <textarea id="review-content" class="rounded-2xl border border-slate-200 px-4 py-3" rows="3" placeholder="후기 내용을 입력하세요"></textarea>
                <select id="review-rating" class="rounded-2xl border border-slate-200 px-4 py-3">
                    <option value="5">★★★★★</option>
                    <option value="4">★★★★☆</option>
                    <option value="3">★★★☆☆</option>
                </select>
                <input type="hidden" id="review-edit-id" />
                <input id="review-image" type="file" accept="image/*" class="md:col-span-3 rounded-2xl border border-slate-200 px-4 py-3" />
                <button id="review-submit-btn" type="button" class="md:col-span-3 rounded-2xl bg-[#B58B5A] px-4 py-3 font-semibold text-white">추가</button>
            </div>
        </div>

        <div id="reviews-list" class="grid md:grid-cols-3 gap-8 mt-12"></div>

    </div>

</div>

</section>
