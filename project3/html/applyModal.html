<!-- ================= APPLY MODAL ================= -->

<div id ="applyModalBox"
class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-backdrop">

<div class="bg-white w-full max-w-2xl p-8 md:p-10 rounded-[2.5rem] shadow-2xl relative mx-4 max-h-[90vh] overflow-y-auto">
<button onclick="closeApplyModal()"
class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 text-2xl">

<i class="fas fa-times"></i>

</button>



<h3 class="text-3xl font-black mb-2">

체험 신청

</h3>


<p class="text-slate-500 mb-8 font-medium">

정보를 입력해주시면 24시간 내에 안내 전화를 드립니다.

</p>





<form id="vividSubmitForm" class="space-y-6">





<div class="grid grid-cols-2 gap-4">


<div>

<label class="block text-sm font-bold text-slate-700 mb-2">

이름

</label>


<input type="text"
name="name"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500"
placeholder="성함">


</div>





<div>


<label class="block text-sm font-bold text-slate-700 mb-2">

성별

</label>


<select name="gender"
class="w-full px-5 py-3 bg-slate-100 rounded-2xl outline-none">


<option value="여">

여성

</option>


<option value="남">

남성

</option>


</select>


</div>



</div>






<div class="grid md:grid-cols-2 gap-4">


<div>

<label class="block text-sm font-bold mb-2">

나이 (만 나이)

</label>


<input type="number"
name="age"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 25">


</div>




<div>


<label class="block text-sm font-bold mb-2">

주소 (동 or 가까운 역)

</label>


<input type="text"
name="location"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 강남역">


</div>



</div>






<div>


<label class="block text-sm font-bold mb-2">

직업 (대학생은 전공 포함)

</label>


<input type="text"
name="job"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 마케팅, 대학생(경영학과)">


</div>






<div>


<label class="block text-sm font-bold mb-2">

퍼스널 컬러를 통해 도움 받고 싶은 부분

</label>


<input type="text"
name="help_pc"
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 메이크업, 패션, 헤어컬러">


</div>







<div>


<label class="block text-sm font-bold mb-2">

이미지 브랜딩을 통해 도움 받고 싶은 부분

</label>


<input type="text"
name="help_ib"
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 분위기, 자신감, 첫인상">


</div>






<div>


<label class="block text-sm font-bold mb-2">

참여 가능한 일시

</label>


<input type="text"
name="available_time"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="예: 평일 17~21시">


</div>







<div class="grid md:grid-cols-2 gap-4">



<div>


<label class="block text-sm font-bold mb-2">

연락처

</label>


<input type="tel"
name="phone"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="010-1234-5678">


</div>






<div>


<label class="block text-sm font-bold mb-2">

인스타그램 ID

</label>


<input type="text"
name="instagram"
required
class="w-full px-5 py-3 bg-slate-100 rounded-2xl"
placeholder="@vivid_me_official">


</div>



</div>






<button
id="submitBtn"
type="submit"
class="w-full bg-[#0085CA] text-white py-5 rounded-2xl font-black text-xl hover:opacity-90 transition">

신청 완료하기

</button>





</form>



</div>


</div>
